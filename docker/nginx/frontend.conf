# Static file server for the built frontend (the `frontend` service).
# The edge `nginx` service proxies `/` to this server in production.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        access_log off;
        expires 1h;
        try_files $uri =404;
    }

    # Single-page application fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
